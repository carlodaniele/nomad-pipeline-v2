name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate structure
        run: bash scripts/ci/validate-structure.sh

      - name: Validate contract
        run: bash scripts/ci/validate-contract.sh

      - name: Dry run pipeline
        run: bash scripts/pipeline/dry-run.sh
