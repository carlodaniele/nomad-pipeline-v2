name: Nomad Pipeline Execution

on:
  push:
    branches: [ingest]
    paths:
      - 'uploads/**/*.mp3'
      - 'uploads/**/*.m4a'
      - 'uploads/**/*.wav'
      - 'uploads/**/*.ogg'
      - 'uploads/**/*.oga'
      - 'uploads/**/*.webm'

permissions:
  contents: write

concurrency:
  group: ingest-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq jq curl

      - name: Run Processing Script
        env:
          WP_ABILITY_URL: ${{ secrets.WP_ABILITY_URL }}
          WP_ABILITY_AUTH: ${{ secrets.WP_ABILITY_AUTH }}
          ADAPTER: ${{ vars.PIPELINE_ADAPTER || 'wordpress' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x scripts/pipeline/process-ingest.sh adapters/wordpress/process.sh
          mapfile -t AUDIO_FILES < <(
            git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" \
              | grep -E '^uploads/.+\.(mp3|m4a|wav|ogg|oga|webm)$' || true
          )

          if [[ ${#AUDIO_FILES[@]} -eq 0 ]]; then
            echo "No new audio files in this push."
            exit 0
          fi

          for audio_path in "${AUDIO_FILES[@]}"; do
            echo "Processing ${audio_path}"
            AUDIO_PATH="${audio_path}" EXTERNAL_RUN_ID="ingest-${RUN_ID}-$(basename "${audio_path}")" \
              bash scripts/pipeline/process-ingest.sh
          done

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add uploads processed failed
          git commit -m "Archive processed ingest sessions"
          git push
