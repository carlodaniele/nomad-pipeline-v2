name: Telegram Listener

on:
  # Start manually from the Actions tab
  workflow_dispatch:
  # Safety net in case the self-restart step misses.
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-listener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run listener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          GH_INGEST_TOKEN: ${{ secrets.GH_INGEST_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INGEST_BRANCH: ${{ vars.INGEST_BRANCH || 'ingest' }}
          # 5.5 hours in seconds — leaves room for self-restart below
          LISTENER_MAX_RUNTIME: '19800'
        run: python scripts/pipeline/telegram-listener.py

      # Keep listener active without manual intervention.
      # Uses PAT because GITHUB_TOKEN cannot start a new run from within a run.
      - name: Self-restart listener
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: gh workflow run telegram-listener.yml --repo "${{ github.repository }}"
